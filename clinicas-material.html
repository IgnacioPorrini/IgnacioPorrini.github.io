<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico">
<title>Material de las clínicas · acceso con clave</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: guía de consulta en una columna, como un derrotero: secciones por necesidad, fichas con su fuente al pie; acento verde de boya de babor */
:root{
  --bg:#EEF3F2; --grid:#DDE6E4; --surface:#FFFFFF; --ink:#10262B; --muted:#4D6469; --line:#C7D5D3;
  --sea:#0E4F73; --sea-ink:#FFFFFF; --buoy:#1F7A4D; --buoy-bg:#E2F2E8; --flag:#B45309;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1619; --grid:#122326; --surface:#112428; --ink:#E2EEEF; --muted:#95ADB1; --line:#24414A;
  --sea:#62B6E0; --sea-ink:#03202E; --buoy:#5CC98E; --buoy-bg:#123020; --flag:#F5B14A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1619; --grid:#122326; --surface:#112428; --ink:#E2EEEF; --muted:#95ADB1; --line:#24414A;
  --sea:#62B6E0; --sea-ink:#03202E; --buoy:#5CC98E; --buoy-bg:#123020; --flag:#F5B14A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:16px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.eyebrow{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font:700 2.8rem/1 var(--display);margin:0;color:var(--sea);text-wrap:balance}
h2{font:700 1.6rem/1.1 var(--display);margin:0;text-wrap:balance}
h3{font:700 1.2rem/1.2 var(--display);margin:0;letter-spacing:.01em}
p{margin:0}
a{color:var(--sea)}
.lede{color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.quick a{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;text-decoration:none;color:var(--ink);font-weight:600}
.quick a small{font-weight:400;color:var(--muted);font-size:13px}
section{display:flex;flex-direction:column;gap:12px;scroll-margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{border-color:var(--buoy);background:var(--buoy-bg)}
.cards{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font:500 12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.contacts{display:flex;flex-wrap:wrap;gap:6px}
.contacts a,.contacts span{font-size:14px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;text-decoration:none;color:var(--ink);word-break:break-all}
.src{font-size:13px;color:var(--muted)}
.src a{color:var(--muted)}
.tag{display:inline-block;white-space:nowrap;vertical-align:middle;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.05em;border-radius:4px;padding:2px 6px;background:var(--buoy-bg);color:var(--buoy)}
.tag.warn{background:transparent;border:1px solid var(--flag);color:var(--flag)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.n{font-variant-numeric:tabular-nums;text-align:right}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 10px}
.note{font-size:14px;color:var(--muted)}
input{font:16px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
footer{font-size:13px;color:var(--muted);text-align:center}
</style>
<style>.num{font:700 2rem/1 var(--display);color:var(--buoy)}.copy{font:15px var(--body);background:var(--buoy-bg);border-radius:8px;padding:12px}</style>
<style>
.check{list-style:none;padding-left:0}.check li::before{content:"☐ ";color:var(--sea)}
#lock input{font:18px var(--mono);padding:12px;border:1px solid var(--line);border-radius:8px;width:100%;max-width:280px;letter-spacing:.1em}
.ficha{display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>
<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:8px">
    <p class="eyebrow">Clínicas de verano · Navegante Escuela Itinerante</p>
    <h1>Material de las clínicas</h1>
  </header>
  <form class="card" id="lock" autocomplete="off">
    <h3>Ingrese la clave</h3>
    <p class="note">La clave se la da el instructor al empezar la clínica.</p>
    <div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><input id="pw" type="password" inputmode="numeric" aria-label="Clave"><button class="chip" type="submit">Entrar</button></div>
    <p class="note" id="msg" role="status"></p>
  </form>
  <div id="content" hidden></div>
  <footer><a href="clinicas.html">Clínicas de verano</a> · <a href="apps/">Apps náuticas</a></footer>
</div>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.s),iterations:D.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.i)},key,b(D.c));return new TextDecoder().decode(pt)}
function mostrar(h){const c=document.getElementById('content');c.innerHTML=h;c.hidden=false;document.getElementById('lock').hidden=true;
 document.getElementById('fsel').addEventListener('click',e=>{const x=e.target.closest('[data-f]');if(!x)return;
  document.querySelectorAll('#fsel .chip').forEach(y=>y.setAttribute('aria-pressed',y===x));
  document.querySelectorAll('.ficha').forEach(f=>f.hidden=f.id!==x.dataset.f)})}
async function probar(pw,silencioso){try{const h=await abrir(pw);try{localStorage.setItem('clinicas-k',pw)}catch(_){}mostrar(h)}catch(_){if(!silencioso)document.getElementById('msg').textContent='Clave incorrecta. Pruebe de nuevo.'}}
document.getElementById('lock').addEventListener('submit',e=>{e.preventDefault();document.getElementById('msg').textContent='Abriendo…';probar(document.getElementById('pw').value.trim())});
try{const k=localStorage.getItem('clinicas-k');if(k)probar(k,true)}catch(_){}
</script>
